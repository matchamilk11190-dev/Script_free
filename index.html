<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind UI Generator & Chat Hub - Andes</title>
    <style>
        :root {
            --hole: radial-gradient(circle, #222 0%, #000 70%);
            --bg-color: #0b0b0f;
            --accent-color: #7c3aed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng Black Hole chính xác theo yêu cầu */
        .Black__hole {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 5%;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            opacity: 0.9;
            border: 2px solid #222;
            filter: blur(2px);
            box-shadow: 0 0 15px #fff;
            background: var(--hole);
            z-index: -1;
            pointer-events: none;
            animation: spinHole 10s linear infinite;
        }

        @keyframes spinHole {
            0% { transform: translateX(-50%) rotate(0deg) scale(0.95); }
            50% { transform: translateX(-50%) rotate(180deg) scale(1.05); }
            100% { transform: translateX(-50%) rotate(360deg) scale(0.95); }
        }

        /* Hiệu ứng đóng/mở trang (Transition Overlay) */
        #transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
            pointer-events: none;
        }

        #transition-overlay.active {
            transform: scaleX(1);
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: rgba(18, 18, 26, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: 40px 0;
            z-index: 1;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            background: linear-gradient(90deg, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #d1d5db;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: #1e1e2f;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button.btn-main {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
        }

        button.btn-main:hover { opacity: 0.9; }
        button.btn-main:active { transform: scale(0.98); }

        /* Giao diện Mô phỏng Wind UI */
        .preview-section, .output-section {
            margin-top: 25px;
        }

        .windui-mockup {
            background: #11111b;
            border: 1px solid #313244;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .mockup-header {
            background: #181825;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #313244;
        }

        .mockup-title {
            font-weight: bold;
            font-size: 14px;
            color: #cba6f7;
        }

        .mockup-body {
            display: flex;
            height: 180px;
        }

        .mockup-sidebar {
            width: 120px;
            background: #141420;
            padding: 10px;
            border-right: 1px solid #313244;
        }

        .mockup-tab {
            padding: 6px 8px;
            background: #1e1e2e;
            border-radius: 6px;
            font-size: 12px;
            color: #bac2de;
            margin-bottom: 6px;
            text-align: center;
        }

        .mockup-content {
            flex: 1;
            padding: 12px;
            font-size: 13px;
            color: #a6adc8;
        }

        textarea.code-output {
            width: 100%;
            height: 130px;
            background: #0f111a;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #68d391;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            resize: none;
            outline: none;
        }

        .btn-copy {
            margin-top: 8px;
            padding: 8px 16px;
            background: #2d3748;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        /* --- TRANG CHAT ROOM --- */
        #chat-page {
            display: none;
            width: 100%;
            max-width: 700px;
            margin: 20px auto;
            flex-direction: column;
            background: rgba(15, 15, 22, 0.9);
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 20px;
            z-index: 1;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d3748;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .chat-messages {
            height: 350px;
            overflow-y: auto;
            background: #0a0a0f;
            border: 1px solid #1e1e2f;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .pinned-box {
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid #7c3aed;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .msg-card {
            background: #161622;
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 3px solid #7c3aed;
            position: relative;
        }

        .msg-card.admin-msg {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.08);
        }

        .msg-author {
            font-weight: bold;
            font-size: 13px;
            color: #a78bfa;
            margin-bottom: 3px;
        }

        .msg-card.admin-msg .msg-author {
            color: #fbbf24;
        }

        .msg-text {
            font-size: 14px;
            color: #e2e8f0;
            word-break: break-all;
        }

        .msg-actions {
            position: absolute;
            top: 8px;
            right: 10px;
            display: flex;
            gap: 6px;
        }

        .msg-actions button {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 12px;
        }

        .msg-actions button:hover { color: #fff; }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
        }

        /* Footer theo yêu cầu */
        .footer {
            padding: 15px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #a78bfa;
            cursor: pointer;
            letter-spacing: 1px;
            transition: color 0.3s, text-shadow 0.3s;
            z-index: 2;
        }

        .footer:hover {
            color: #fff;
            text-shadow: 0 0 10px #7c3aed;
        }

        .admin-status {
            font-size: 12px;
            color: #f59e0b;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Hiệu ứng lỗ đen -->
    <div class="Black__hole"></div>
    <!-- Hiệu ứng màn chắn chuyển cảnh -->
    <div id="transition-overlay"></div>

    <!-- TRANG 1: WIND UI GENERATOR -->
    <div class="container" id="generator-page">
        <h1>Wind UI Script Generator</h1>
        
        <div class="input-group">
            <label for="scriptName">Nhập tên Menu / Script Hub:</label>
            <input type="text" id="scriptName" placeholder="Ví dụ: WAERMA HUB..." value="WAERMA HUB">
        </div>

        <button class="btn-main" onclick="generateScript()">Tạo Script & Mô Phỏng</button>

        <div class="preview-section">
            <label>Mô phỏng Giao diện Wind UI (Live Preview):</label>
            <div class="windui-mockup">
                <div class="mockup-header">
                    <span class="mockup-title" id="previewTitle">WAERMA HUB</span>
                </div>
                <div class="mockup-body">
                    <div class="mockup-sidebar">
                        <div class="mockup-tab" style="background: #313244; color: #fff;">Trang Chủ</div>
                        <div class="mockup-tab">Tính Năng</div>
                    </div>
                    <div class="mockup-content">
                        <p style="font-weight: bold; color: #fff;">Sẵn sàng chạy!</p>
                        <p>Menu Wind UI tương thích mượt mà trên Roblox.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="output-section">
            <label>Mã Script Luau (Roblox):</label>
            <textarea id="scriptOutput" class="code-output" readonly></textarea>
            <button class="btn-copy" onclick="copyCode()">Sao chép Script</button>
        </div>
    </div>

    <!-- TRANG 2: KHUNG TRÒ CHUYỆN (CHAT ROOM) -->
    <div id="chat-page">
        <div class="chat-header">
            <div>
                <h2 style="font-size: 18px; color: #a78bfa;">Phòng Trò Chuyện Cộng Đồng</h2>
                <span class="admin-status" id="adminToggleText" onclick="toggleAdmin()">🔒 Đăng nhập Chủ Web (Admin)</span>
            </div>
            <button class="btn-main" style="width: auto; padding: 6px 14px; font-size: 13px;" onclick="switchPage('generator')">Quay lại Generator</button>
        </div>

        <!-- Khung Ghim Tin Nhắn -->
        <div id="pinnedMessageContainer" style="display: none;">
            <div class="pinned-box">
                📌 <strong>Tin nhắn được ghim bởi Chủ Web:</strong>
                <div id="pinnedContent" style="margin-top: 4px; color: #f3f4f6;"></div>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- Danh sách tin nhắn render tự động -->
        </div>

        <div class="chat-input-area">
            <input type="text" id="chatName" placeholder="Tên của bạn..." style="max-width: 150px;">
            <input type="text" id="chatText" placeholder="Nhập tin nhắn..." onkeypress="handleKeyPress(event)">
            <button class="btn-main" style="width: 100px;" onclick="sendMessage()">Gửi</button>
        </div>
        <div id="cooldownTimer" style="font-size: 11px; color: #ef4444; margin-top: 6px; text-align: right;"></div>
    </div>

    <!-- FOOTER CHUYỂN TRANG -->
    <footer class="footer" onclick="switchPage('chat')">
        by andes (Nhấn vào đây để vào phòng chat)
    </footer>

    <script>
        // --- QUẢN LÝ CHUYỂN TRANG VỚI HIỆU ỨNG ĐÓNG MỞ ---
        let currentPage = 'generator';
        let isAdmin = false;
        let lastOwnerMessageTime = 0; // Lưu thời gian gửi gần nhất của chủ web

        function switchPage(target) {
            if (currentPage === target) return;
            
            const overlay = document.getElementById('transition-overlay');
            overlay.classList.add('active');

            setTimeout(() => {
                if (target === 'chat') {
                    document.getElementById('generator-page').style.display = 'none';
                    document.getElementById('chat-page').style.display = 'flex';
                    currentPage = 'chat';
                    renderMessages();
                } else {
                    document.getElementById('chat-page').style.display = 'none';
                    document.getElementById('generator-page').style.display = 'block';
                    currentPage = 'generator';
                }

                // Mở màn chắn ra
                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 100);
            }, 500);
        }

        // --- CODE GENERATOR LOGIC ---
        function generateScript() {
            const name = document.getElementById('scriptName').value.trim() || 'Custom Hub';
            document.getElementById('previewTitleinnerText') = name;
            document.getElementById('previewTitle').innerText = name;

            const luaCode = `-- [ Wind UI Script Generated for ${name} ]
local WindUI = loadstring(game:HttpGet("https://raw.githubusercontent.com/Footagesus/WindUI/main/init.lua"))()

local Window = WindUI:CreateWindow({
    Title = "${name}",
    Icon = "rbxassetid://6034287593",
    Author = "Andes Hub",
    Folder = "WindUIHub",
    Size = UDim2.fromOffset(580, 460),
    Transparent = true,
    Theme = "Dark",
    Acrylic = true
})

local Tab = Window:Tab({ Title = "Trang Chủ", Icon = "home" })
Tab:Section({ Title = "Khu vực điều khiển" })
Tab:Paragraph({ Title = "Thông tin", Content = "Script hoạt động mượt mà trong Roblox." })
`;
            document.getElementById('scriptOutput').value = luaCode;
        }

        function copyCode() {
            const copyText = document.getElementById("scriptOutput");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Đã sao chép mã Luau!");
        }

        // --- CHAT SYSTEM & ADMIN LOGIC ---
        function getMessages() {
            return JSON.parse(localStorage.getItem('andes_chat_messages')) || [];
        }

        function saveMessages(msgs) {
            localStorage.setItem('andes_chat_messages', JSON.stringify(msgs));
        }

        function getPinned() {
            return localStorage.getItem('andes_chat_pinned') || '';
        }

        function savePinned(text) {
            localStorage.setItem('andes_chat_pinned', text);
        }

        function toggleAdmin() {
            if (!isAdmin) {
                const pass = prompt("Nhập mật khẩu Chủ Web (Admin):");
                if (pass === "andes123" || pass === "andes") {
                    isAdmin = true;
                    document.getElementById('adminToggleText').innerText = "🔓 Chế độ Chủ Web: Đang Bật (Admin)";
                    document.getElementById('adminToggleText').style.color = "#10b981";
                    document.getElementById('chatName').value = "Andes [Chủ Web]";
                    document.getElementById('chatName').disabled = true;
                    alert("Đã đăng nhập thành công quyền Chủ Web!");
                    renderMessages();
                } else if (pass !== null) {
                    alert("Mật khẩu không chính xác!");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminToggleText').innerText = "🔒 Đăng nhập Chủ Web (Admin)";
                document.getElementById('adminToggleText').style.color = "#f59e0b";
                document.getElementById('chatName').value = "";
                document.getElementById('chatName').disabled = false;
                alert("Đã thoát chế độ Chủ Web.");
                renderMessages();
            }
        }

        function sendMessage() {
            const nameInput = document.getElementById('chatName');
            const textInput = document.getElementById('chatText');
            
            let name = nameInput.value.trim();
            const text = textInput.value.trim();

            if (!name) { alert("Vui lòng nhập tên của bạn!"); return; }
            if (!text) return;

            // Kiểm tra quy tắc 10 giây cho Chủ Web
            if (isAdmin) {
                const now = Date.now();
                const elapsed = (now - lastOwnerMessageTime) / 1000;
                if (elapsed < 10) {
                    const timeLeft = Math.ceil(10 - elapsed);
                    alert(`Chủ web cần chờ thêm ${timeLeft} giây nữa mới được nhắn tiếp!`);
                    return;
                }
                lastOwnerMessageTime = now;
            }

            const messages = getMessages();
            const newMsg = {
                id: Date.now(),
                name: isAdmin ? "👑 " + name : name,
                text: text,
                isAdminMsg: isAdmin,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            messages.push(newMsg);
            saveMessages(messages);
            textInput.value = "";
            renderMessages();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function deleteMessage(id) {
            if (!isAdmin) { alert("Chỉ chủ web mới có quyền xóa tin nhắn!"); return; }
            let messages = getMessages();
            messages = messages.filter(m => m.id !== id);
            saveMessages(messages);
            renderMessages();
        }

        function pinMessage(text) {
            if (!isAdmin) { alert("Chỉ chủ web mới có quyền ghim tin nhắn!"); return; }
            savePinned(text);
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');
            const messages = getMessages();
            
            // Render Ghim
            const pinned = getPinned();
            const pinnedContainer = document.getElementById('pinnedMessageContainer');
            if (pinned) {
                pinnedContainer.style.display = 'block';
                document.getElementById('pinnedContent').innerText = pinned;
            } else {
                pinnedContainer.style.display = 'none';
            }

            container.innerHTML = '';
            if (messages.length === 0) {
                container.innerHTML = '<div style="color: #64748b; text-align: center; margin-top: 20px;">Chưa có tin nhắn nào. Hãy mở lời chào đầu tiên!</div>';
                return;
            }

            messages.forEach(m => {
                const card = document.createElement('div');
                card.className = `msg-card ${m.isAdminMsg ? 'admin-msg' : ''}`;
                
                let adminButtons = '';
                if (isAdmin) {
                    adminButtons = `
                        <div class="msg-actions">
                            <button onclick="pinMessage('${m.text.replace(/'/g, "\\'")}')" title="Ghim tin nhắn">📌</button>
                            <button onclick="deleteMessage(${m.id})" title="Xóa tin nhắn">❌</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${adminButtons}
                    <div class="msg-author">${m.name} <span style="font-size: 10px; color: #64748b; font-weight: normal;">${m.time}</span></div>
                    <div class="msg-text">${escapeHtml(m.text)}</div>
                `;
                container.appendChild(card);
            });

            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = function() {
            generateScript();
            renderMessages();
        };
    </script>
</body>
</html>
